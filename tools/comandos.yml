# Fuente única de la guía de comandos de Mapucraft.
# De aquí salen: wiki/el-servidor/comandos.md, bot/GUIA_TOWNY.md (sección AUTO)
# y bot/servidor-towny/comandos.json (lo lee guia_comandos.js).
# Después de editar: python wiki/tools/generar_comandos.py   (agrega --dry-run para solo validar)
#
# Campos de cada comando: name (único, es lo que se muestra), descripcion, permiso (rango/permiso
# necesario; "todos" si no pide nada), modo (towny | skyblock | ambos | discord), alias (opcional).
# Los comandos no verificados contra el servidor Skyblock se dejan en modo towny.

embeds:
